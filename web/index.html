<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareCircle</title>
<meta name="description" content="CareCircle family dashboard and simulated Alexa.">
<!-- Fonts and icons are served from local npm packages (see VENDOR_ASSETS in src/server.ts), so the demo works offline. -->
<link rel="stylesheet" href="/vendor/geist/index.css">
<link rel="stylesheet" href="/vendor/geist-mono/index.css">
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="/vendor/phosphor/fill/style.css">
<style>
  /*
   * Colour system: every kind of care data has its own hue, used the same way everywhere
   * (widget tile, timeline icon, chips):
   *   medication = coral, check-in = sun, mood = sky, meals = leaf, appointments = teal.
   * Each hue has a tile background (--x-bg), a strong fill (--x) and a readable ink (--x-ink).
   * Alerts use the dark "ink" tile. Cyan is reserved for the Alexa light ring.
   */
  :root {
    --bg: #eef1f5; --surface: #ffffff; --ink: #18202d; --muted: #5d6676; --line: #e2e6ee;
    --med: #ff6a55; --med-bg: #ffe8e3; --med-ink: #b2321f;
    --sun: #ffb931; --sun-bg: #fff2cc; --sun-ink: #8a5600;
    --sky: #3d9bff; --sky-bg: #e2f0ff; --sky-ink: #0d5ab0;
    --leaf: #2dbb6e; --leaf-bg: #ddf6e7; --leaf-ink: #11693a;
    --teal: #12b3a8; --teal-bg: #d9f5f2; --teal-ink: #0a6a64;
    --dark: #18202d; --dark-ink: #f3f5f9; --dark-muted: #a3acbd;
    --device: #121821; --device-2: #1b2330; --device-3: #283244; --device-ink: #eef2f8; --device-muted: #98a3b6;
    --ring: #35c6ee;
    --radius: 20px; --radius-sm: 12px;
    --sans: "Geist Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono Variable", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1017; --surface: #151b25; --ink: #eef2f8; --muted: #9aa4b5; --line: #232c3a;
      --med-bg: #3a1c19; --med-ink: #ff9a8a;
      --sun-bg: #3a2c0c; --sun-ink: #ffd27a;
      --sky-bg: #12283f; --sky-ink: #8cc4ff;
      --leaf-bg: #10301f; --leaf-ink: #7fe0a8;
      --teal-bg: #0f2f2d; --teal-ink: #6fe0d6;
      --dark: #232c3b; --device: #080b11; --device-2: #121821; --device-3: #1f2836;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .ph, .ph-fill { line-height: 1; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Top bar */
  .bar { max-width: 1400px; margin: 0 auto; padding: 16px 20px 0; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -0.02em; }
  .mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; color: #fff; background: var(--med); }
  .who-chip { font-size: 13px; color: var(--muted); font-weight: 450; }
  .backends { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .backend { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--surface); border-radius: 999px; padding: 6px 11px; white-space: nowrap; color: var(--muted); }
  .backend b { color: var(--ink); font-weight: 550; }
  .backend.live b { color: var(--leaf-ink); }
  .backend.live.down b { color: var(--med-ink); }
  @media (max-width: 900px) { .backends .backend:not(.live) { display: none; } }

  main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 28px; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 12px 16px 24px; } }

  /* Simulated Alexa device */
  .device { position: sticky; top: 16px; background: var(--device); color: var(--device-ink); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: calc(100dvh - 84px); min-height: 540px; }
  @media (max-width: 1000px) { .device { position: static; height: 560px; } }
  .device-head { display: flex; align-items: center; gap: 12px; }
  .ring { width: 38px; height: 38px; border-radius: 50%; flex: none; position: relative; background: conic-gradient(var(--ring), #2c6cf0, var(--ring)); opacity: .3; transition: opacity .4s var(--ease); }
  .ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--device); }
  .device:not([data-state="idle"]) .ring { opacity: 1; }
  .device-title b { display: block; font-size: 15px; font-weight: 600; }
  .device-title span { font-size: 12px; color: var(--device-muted); }
  .seg { margin-left: auto; display: flex; background: var(--device-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--device-muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: background .2s var(--ease), color .2s var(--ease); }
  .seg button[aria-pressed="true"][data-role="parent"] { background: var(--sun); color: #2a1c00; }
  .seg button[aria-pressed="true"][data-role="family"] { background: var(--sky); color: #04203f; }

  .transcript { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--device-3) transparent; }
  .hello { margin: auto 0; text-align: center; color: var(--device-muted); font-size: 14px; }
  .hello .big { font-size: 40px; color: var(--ring); display: block; margin-bottom: 6px; }
  .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; animation: rise .35s var(--ease) both; }
  .msg .text { padding: 10px 13px; border-radius: 18px; white-space: pre-wrap; font-size: 14.5px; }
  .msg.you { align-self: flex-end; align-items: flex-end; }
  .msg.you .text { background: var(--sun); color: #2a1c00; border-bottom-right-radius: 6px; }
  .msg.you.family .text { background: var(--sky); color: #04203f; }
  .msg.alexa { align-self: flex-start; }
  .msg.alexa .text { background: var(--device-2); border-bottom-left-radius: 6px; }
  .msg.alexa.error .text { color: #ffb4a8; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--device-muted); animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  .calls { display: flex; flex-wrap: wrap; gap: 4px; }
  .call { font-size: 12px; }
  .call summary { list-style: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--device-3); cursor: pointer; font-family: var(--mono); color: var(--ring); }
  .call summary::-webkit-details-marker { display: none; }
  .call[open] { flex-basis: 100%; }
  .call pre { margin: 6px 0 0; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--device-2); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--device-ink); }
  .call pre .k { color: var(--device-muted); }

  .suggest { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .suggest::-webkit-scrollbar { display: none; }
  .suggest button { flex: none; background: var(--device-2); border: 0; color: var(--device-ink); border-radius: 999px; padding: 7px 12px; font-size: 13px; transition: background .2s var(--ease), transform .1s; }
  .suggest button:hover { background: var(--device-3); }
  .suggest button:active { transform: scale(.97); }
  .composer { display: flex; gap: 6px; align-items: center; background: var(--device-2); border-radius: 999px; padding: 5px; }
  .composer:focus-within { box-shadow: 0 0 0 2px var(--ring); }
  .composer input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--device-ink); padding: 8px 6px 8px 10px; font: inherit; outline: none; }
  .composer input::placeholder { color: var(--device-muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; font-size: 18px; flex: none; transition: transform .1s, background .2s var(--ease); }
  .icon-btn:active { transform: scale(.94); }
  .mic { background: var(--device-3); color: var(--device-ink); }
  .mic.listening { background: var(--ring); color: var(--device); }
  .send { background: var(--ring); color: #03202b; }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Bento of widgets */
  .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .w { border-radius: var(--radius); padding: 18px; min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 1280px) { .c3 { grid-column: span 6; } .c4, .c5, .c7, .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
  @media (max-width: 560px) { .c3 { grid-column: span 12; } }
  .w-top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .w-top .tag { margin-left: auto; font-size: 12px; font-weight: 550; padding: 3px 9px; border-radius: 999px; background: rgb(255 255 255 / .55); white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .w-top .tag { background: rgb(255 255 255 / .08); } }
  .w-icon { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; color: #fff; flex: none; }
  .big { font-size: 34px; font-weight: 650; line-height: 1; letter-spacing: -0.04em; }
  .small { font-size: 12.5px; opacity: .85; }

  .w.med { background: var(--med-bg); color: var(--med-ink); } .med .w-icon { background: var(--med); }
  .w.sun { background: var(--sun-bg); color: var(--sun-ink); } .sun .w-icon { background: var(--sun); color: #3a2600; }
  .w.sky { background: var(--sky-bg); color: var(--sky-ink); } .sky .w-icon { background: var(--sky); }
  .w.leaf { background: var(--leaf-bg); color: var(--leaf-ink); } .leaf .w-icon { background: var(--leaf); }
  .w.teal { background: var(--teal-bg); color: var(--teal-ink); } .teal .w-icon { background: var(--teal); }
  .w.dark { background: var(--dark); color: var(--dark-ink); } .dark .w-icon { background: var(--med); }
  .w.plain { background: var(--surface); color: var(--ink); }

  /* "Alexa would say" banner */
  .say { flex-direction: row; align-items: center; gap: 14px; padding: 14px 18px; }
  .say .w-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--device); color: var(--ring); font-size: 20px; }
  .say p { margin: 0; font-size: 15.5px; line-height: 1.5; }
  .say .q { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }

  /* Check-in */
  .sunrise { margin-top: auto; display: flex; align-items: end; justify-content: space-between; gap: 8px; }
  .sunrise .ph-fill { font-size: 54px; color: var(--sun); }
  .sun.pending .sunrise .ph-fill { opacity: .35; }

  /* Medication donut */
  .donut-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .donut-wrap { position: relative; width: 68px; height: 68px; flex: none; }
  .donut-wrap b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 650; }
  .donut { width: 68px; height: 68px; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 10; }
  .donut .track { stroke: rgb(255 106 85 / .2); }
  .donut .fill { stroke: var(--med); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
  .dose-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .dose-list li { display: flex; align-items: center; gap: 7px; font-size: 13px; min-width: 0; }
  .dose-list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dose-list li .t { margin-left: auto; font-size: 11.5px; opacity: .8; flex: none; }
  .dose-list i { font-size: 16px; }
  .dose-list .late { font-weight: 600; }

  /* Mood */
  .faces { display: flex; justify-content: space-between; gap: 4px; }
  .faces i { font-size: 30px; opacity: .25; transition: opacity .3s, transform .3s var(--ease); }
  .faces i.on { opacity: 1; transform: scale(1.18); color: var(--sky); }
  .bars { display: flex; align-items: end; gap: 5px; height: 38px; margin-top: auto; }
  .bars span { flex: 1; border-radius: 4px; background: var(--sky); min-height: 4px; opacity: .85; }
  .bars span.none { background: transparent; border: 1.5px dashed currentColor; opacity: .3; height: 8px !important; }
  .bars span.today { opacity: 1; }
  .bar-days { display: flex; gap: 5px; font-size: 10.5px; opacity: .7; }
  .bar-days span { flex: 1; text-align: center; }

  /* Meals */
  .bowls { display: flex; gap: 8px; margin-top: auto; }
  .bowls div { flex: 1; aspect-ratio: 1; max-width: 64px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; border: 2px dashed currentColor; opacity: .35; }
  .bowls div.on { background: var(--leaf); color: #fff; border-color: transparent; opacity: 1; }

  /* Week grid */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
  .day-col { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; background: var(--bg); }
  .day-col.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .day-col .dn { font-size: 12px; font-weight: 600; color: var(--muted); }
  .day-col .doses { display: flex; flex-direction: column; gap: 4px; }
  .day-col .dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; }
  .dot.taken { background: var(--med); color: #fff; }
  .dot.missed { border: 2px dashed var(--med); color: var(--med); }
  .dot.pending { border: 2px solid var(--line); }
  .day-col .ci { font-size: 18px; color: var(--sun); }
  .day-col .ci.no { color: var(--muted); opacity: .4; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .dot { width: 14px; height: 14px; border-radius: 4px; }

  /* Appointment */
  .countdown { margin-top: auto; display: flex; align-items: end; gap: 12px; }
  .cal { width: 64px; flex: none; border-radius: 14px; overflow: hidden; background: var(--surface); text-align: center; color: var(--ink); }
  .cal .m { background: var(--teal); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 0; text-transform: uppercase; }
  .cal .d { font-size: 26px; font-weight: 650; padding: 4px 0 6px; }

  /* Alerts */
  .alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .alert-list li { font-size: 13px; padding: 9px 11px; border-radius: var(--radius-sm); background: rgb(255 255 255 / .06); display: flex; gap: 8px; }
  .alert-list li i { color: var(--med); font-size: 16px; margin-top: 1px; }
  .alert-list .when { color: var(--dark-muted); font-size: 11.5px; display: block; }
  .allgood { margin-top: auto; display: flex; align-items: center; gap: 10px; color: var(--dark-muted); font-size: 13px; }
  .allgood i { font-size: 30px; color: var(--leaf); }

  /* Activity feed */
  .feed { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .feed li { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 14px; background: var(--bg); min-width: 0; }
  .feed li .fi { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; flex: none; color: #fff; }
  .feed li .ft { font-size: 13.5px; min-width: 0; }
  .feed li .ft .tx { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .feed li .meta { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; }
  .feed li.fresh { animation: pop .6s var(--ease); box-shadow: inset 0 0 0 2px var(--leaf); }
  .fi.medication { background: var(--med); } .fi.checkin { background: var(--sun); color: #3a2600 !important; } .fi.mood { background: var(--sky); } .fi.meal { background: var(--leaf); } .fi.note { background: var(--teal); }
  .seg-filter { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .seg-filter button { border: 0; background: var(--bg); color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .seg-filter button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  /* Behind the scenes */
  .backstage { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; }
  @media (max-width: 900px) { .backstage { grid-template-columns: 1fr; } }
  .svc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-content: start; }
  .svc { border-radius: 14px; padding: 10px 12px; background: rgb(255 255 255 / .06); min-width: 0; }
  .svc b { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .svc b i { font-size: 16px; color: var(--ring); }
  .svc span { display: block; font-size: 11.5px; color: var(--dark-muted); margin-top: 3px; overflow-wrap: anywhere; }
  .log { list-style: none; margin: 0; padding: 12px; border-radius: 14px; background: rgb(0 0 0 / .25); font: 12px/1.6 var(--mono); max-height: 220px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: 64px 92px minmax(0, 1fr); gap: 8px; }
  .log .lt { color: var(--dark-muted); }
  .log .ls { font-weight: 600; }
  .log .ls.Lambda { color: var(--sun); } .log .ls.EventBridge { color: var(--teal); } .log .ls.Alert { color: var(--med); }
  .log .lm { overflow-wrap: anywhere; }
  .log .empty-note { display: block; color: var(--dark-muted); font-family: var(--sans); }

  /* Actions */
  .action { border: 0; text-align: left; gap: 18px; min-height: 120px; transition: transform .15s var(--ease); }
  .action:hover { transform: translateY(-2px); }
  .action:active { transform: translateY(0) scale(.99); }
  .action i { font-size: 26px; }
  .action b { font-size: 15px; display: block; }
  .action span { font-size: 12.5px; opacity: .8; }
  .action:disabled { opacity: .6; cursor: progress; }
  .result-chip { font-size: 13px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; gap: 6px; }

  .empty-note { font-size: 13px; opacity: .8; }
  .sk { border-radius: 8px; background: currentColor; opacity: .12; animation: breathe 1.4s ease-in-out infinite; height: 14px; }

  /* Weekly summary dialog */
  dialog { border: 0; padding: 0; border-radius: 22px; width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgb(8 12 18 / .55); backdrop-filter: blur(3px); }
  dialog[open] { animation: rise .3s var(--ease); }
  .doc-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; position: sticky; top: 0; background: var(--teal-bg); color: var(--teal-ink); }
  .doc-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .doc-head .icon-btn { background: var(--surface); color: var(--ink); }
  .doc { padding: 22px 26px 28px; white-space: pre-wrap; font-size: 15px; line-height: 1.65; max-width: 68ch; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.96); } to { transform: none; } }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes breathe { 0%, 100% { opacity: .08; } 50% { opacity: .18; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @media (prefers-reduced-motion: no-preference) {
    .device[data-state="thinking"] .ring { animation: spin 1.1s linear infinite; }
    .device[data-state="listening"] .ring, .device[data-state="speaking"] .ring { animation: pulse 1.2s ease-in-out infinite; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  @media print {
    body > *:not(dialog) { display: none !important; }
    dialog { position: static; width: auto; max-height: none; }
    .doc-head button { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i class="ph-fill ph-hand-heart"></i></div>
    CareCircle <span class="who-chip" id="tagline"></span>
  </div>
  <div class="backends" id="backends" aria-label="Active backends"></div>
</header>

<main>
  <section class="device" id="device" data-state="idle" aria-label="Simulated Alexa">
    <div class="device-head">
      <div class="ring" aria-hidden="true"></div>
      <div class="device-title"><b>Alexa</b><span id="device-status">Ready</span></div>
      <div class="seg" id="speakers" role="group" aria-label="Who is talking"></div>
    </div>
    <div class="transcript" id="chat" aria-live="polite">
      <div class="hello" id="hello"><i class="ph ph-waveform big"></i><span id="hello-text">Tap a phrase or type to talk.</span></div>
    </div>
    <div class="suggest" id="chips" aria-label="Suggestions"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn mic" id="mic" aria-label="Speak"><i class="ph ph-microphone"></i></button>
      <label for="say" class="visually-hidden">What you say to Alexa</label>
      <input id="say" placeholder="Say something to Alexa">
      <button type="submit" class="icon-btn send" id="send" aria-label="Send"><i class="ph ph-arrow-up"></i></button>
    </form>
  </section>

  <section class="bento" aria-label="Family view">
    <article class="w plain say c12">
      <div class="w-icon"><i class="ph-fill ph-speaker-high"></i></div>
      <p><span class="q" id="say-q">"How's Mom today?"</span><span id="summary"><span class="sk" style="display:block;width:60%"></span></span></p>
    </article>

    <article class="w sun c3" id="w-checkin">
      <div class="w-top"><span class="w-icon"><i class="ph ph-sun-horizon"></i></span>Check-in<span class="tag" id="ci-tag"></span></div>
      <div class="sunrise"><div style="min-width:0"><div class="big" id="ci-time" style="white-space:nowrap;font-size:30px">--</div><div class="small" id="ci-sub"></div></div><i class="ph-fill ph-sun"></i></div>
    </article>

    <article class="w med c3">
      <div class="w-top"><span class="w-icon"><i class="ph ph-pill"></i></span>Medications<span class="tag" id="med-tag"></span></div>
      <div class="donut-row">
        <div class="donut-wrap"><svg class="donut" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="40"/><circle class="fill" id="donut" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg><b class="num" id="donut-label"></b></div>
        <div class="small" id="med-sub"></div>
      </div>
      <ul class="dose-list" id="doses"></ul>
    </article>

    <article class="w sky c3">
      <div class="w-top"><span class="w-icon"><i class="ph ph-smiley"></i></span>Mood<span class="tag" id="mood-tag"></span></div>
      <div class="faces" id="faces"></div>
      <div><div class="bars" id="mood-bars"></div><div class="bar-days" id="mood-days"></div></div>
    </article>

    <article class="w leaf c3">
      <div class="w-top"><span class="w-icon"><i class="ph ph-bowl-food"></i></span>Meals<span class="tag" id="meal-tag"></span></div>
      <div class="big num" id="meal-count">0</div>
      <div class="bowls" id="bowls"></div>
    </article>

    <article class="w plain c6">
      <div class="w-top"><span class="w-icon" style="background:var(--ink);color:var(--surface)"><i class="ph ph-calendar-dots"></i></span>This week<span class="tag" id="week-tag" style="background:var(--med-bg);color:var(--med-ink)"></span></div>
      <div class="week" id="week"></div>
      <div class="legend">
        <span><span class="dot taken"></span>Dose taken</span>
        <span><span class="dot missed"></span>Missed</span>
        <span><i class="ph-fill ph-sun" style="color:var(--sun)"></i>Checked in</span>
      </div>
    </article>

    <article class="w teal c3">
      <div class="w-top"><span class="w-icon"><i class="ph ph-stethoscope"></i></span>Next visit</div>
      <div id="appt" style="display:flex;flex-direction:column;gap:10px;flex:1"></div>
    </article>

    <article class="w dark c3">
      <div class="w-top"><span class="w-icon"><i class="ph ph-bell-ringing"></i></span>Alerts<span class="tag" id="alert-tag"></span></div>
      <div id="alerts" style="display:flex;flex-direction:column;flex:1"></div>
    </article>

    <article class="w dark c12" id="backstage">
      <div class="w-top"><span class="w-icon" style="background:var(--ring);color:#03202b"><i class="ph ph-cpu"></i></span>Behind the scenes<span class="tag" id="env-tag"></span></div>
      <div class="backstage">
        <div class="svc-list" id="env"></div>
        <ul class="log" id="activity"></ul>
      </div>
    </article>

    <article class="w plain c8">
      <div class="w-top"><span class="w-icon" style="background:var(--ink);color:var(--surface)"><i class="ph ph-pulse"></i></span>Activity
        <div class="seg-filter" id="feed-filter" role="group" aria-label="Show"></div>
      </div>
      <ul class="feed" id="feed"></ul>
    </article>

    <div class="c4" style="display:grid;gap:14px;align-content:start">
      <button class="action w sun" id="check"><i class="ph ph-magnifying-glass"></i><div><b>Check for misses</b><span>Run the alert scan now</span></div></button>
      <div class="result-chip" id="report" hidden></div>
      <button class="action w teal" id="weekly"><i class="ph ph-file-text"></i><div><b>Doctor summary</b><span>One page, printable</span></div></button>
    </div>
  </section>
</main>

<dialog id="doc-dialog" aria-labelledby="doc-title">
  <div class="doc-head">
    <i class="ph ph-file-text" style="font-size:20px"></i>
    <h2 id="doc-title">Weekly summary for the doctor</h2>
    <button class="icon-btn" id="doc-print" aria-label="Print"><i class="ph ph-printer"></i></button>
    <button class="icon-btn" id="doc-close" aria-label="Close"><i class="ph ph-x"></i></button>
  </div>
  <div class="doc" id="doc-body"></div>
</dialog>

<script>
/*
 * Family dashboard + simulated Alexa. Reads the local JSON API served by src/server.ts:
 *   /api/config, /api/status, /api/today, /api/upcoming, /api/timeline, /api/week, /api/activity (polled)
 *   /api/alexa (simulator turn), /api/check (alert scan), /api/weekly (doctor summary).
 * Everything is re-rendered every REFRESH_MS; activity that arrived since the last poll is highlighted.
 */
const REFRESH_MS = 5000;
const DONUT_LEN = 2 * Math.PI * 40;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let cfg = { parentName: "Mom", timeZone: undefined, checkinDeadline: "10:00" };
let speaker = null;
let seenEvents = null;
let feedFilter = "all";
let lastTimeline = [];

const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZone: cfg.timeZone });
const fmtHHMM = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const dayKey = (d) => new Date(d).toLocaleDateString("en-CA", { timeZone: cfg.timeZone });
const nowHHMM = () => new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: cfg.timeZone }).format(new Date());
const ymdLabel = (ymd, opts) => new Date(`${ymd}T12:00:00Z`).toLocaleDateString([], { timeZone: "UTC", ...opts });
const isParent = (name) => name === cfg.parentName;

const KIND = {
  medication: { icon: "ph-pill", label: "Meds" },
  checkin: { icon: "ph-sun-horizon", label: "Check-ins" },
  mood: { icon: "ph-smiley", label: "Mood" },
  meal: { icon: "ph-bowl-food", label: "Meals" },
  note: { icon: "ph-note-pencil", label: "Notes" },
};
const FACES = ["ph-smiley-sad", "ph-smiley-meh", "ph-smiley-blank", "ph-smiley", "ph-smiley-wink"];
const MOOD_LABEL = ["", "Very low", "Low", "Okay", "Good", "Great"];
const BACKEND_LABEL = {
  store: { file: "Local file", memory: "Memory", dynamodb: "DynamoDB" },
  summarizer: { template: "Templates", bedrock: "Claude" },
  notifier: { console: "Dashboard", sns: "SNS" },
  brain: { rules: "Rules", bedrock: "Claude" },
};

async function api(path, opts) {
  const res = await fetch(`/api/${path}`, opts);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/* ---------- Simulated Alexa ---------- */

function setState(state) {
  $("device").dataset.state = state;
  $("device-status").textContent = { idle: "Ready", listening: "Listening", thinking: "Thinking", speaking: "Speaking" }[state];
}

function setupSpeakers() {
  const people = [{ name: cfg.parentName, icon: "ph-user", role: "parent" }, { name: "Sarah", icon: "ph-users", role: "family" }];
  speaker = people[0].name;
  $("speakers").innerHTML = people.map((p, i) =>
    `<button type="button" aria-pressed="${i === 0}" data-role="${p.role}" data-p="${esc(p.name)}"><i class="ph ${p.icon}"></i>${esc(p.name)}</button>`).join("");
  $("speakers").querySelectorAll("button").forEach((b) => b.onclick = () => {
    speaker = b.dataset.p;
    $("speakers").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    renderChips();
  });
  renderChips();
}

function renderChips() {
  const phrases = isParent(speaker)
    ? ["Good morning!", "Had my oatmeal and the little white pill", "I'm feeling tired today", "What do I still need to take?", "Remind me about the doctor Thursday at 2pm", "Tell the kids I'm going to bed early"]
    : [`How's ${cfg.parentName} today?`, `Did ${cfg.parentName} miss anything?`, "Remind me to call the pharmacy tomorrow at 10am", "Give me the weekly summary"];
  $("chips").innerHTML = phrases.map((p) => `<button type="button">${esc(p)}</button>`).join("");
  $("chips").querySelectorAll("button").forEach((b) => b.onclick = () => ask(b.textContent));
  const hello = $("hello-text");
  if (hello) hello.textContent = isParent(speaker) ? `Speaking as ${cfg.parentName}` : `Speaking as Sarah, ${cfg.parentName}'s daughter`;
}

function addMessage(cls, html) {
  $("hello")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = `<div class="text">${html}</div>`;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

function renderCalls(trace) {
  const fmtArgs = (a) => Object.entries(a || {}).map(([k, v]) => `<span class="k">${esc(k)}:</span> ${esc(typeof v === "string" ? v : JSON.stringify(v))}`).join("\n") || '<span class="k">no arguments</span>';
  return `<div class="calls">${trace.map((t) => `
    <details class="call"><summary><i class="ph ph-plugs-connected"></i>${esc(t.tool)}</summary>
      <pre>${fmtArgs(t.arguments)}\n\n<span class="k">result:</span> ${esc(t.result)}</pre></details>`).join("")}</div>`;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return setState("idle");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.split("\n\n")[0]);
  u.rate = 1.02;
  u.onend = u.onerror = () => setState("idle");
  setState("speaking");
  speechSynthesis.speak(u);
}

let busy = false;
async function ask(utterance) {
  utterance = utterance.trim();
  if (!utterance || busy) return;
  busy = true;
  $("send").disabled = true;
  addMessage(`you ${isParent(speaker) ? "" : "family"}`, esc(utterance));
  const reply = addMessage("alexa", '<span class="typing" aria-label="Alexa is thinking"><span></span><span></span><span></span></span>');
  setState("thinking");
  try {
    const turn = await api("alexa", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ utterance, speaker }) });
    reply.querySelector(".text").textContent = turn.reply || "Okay.";
    if (turn.trace.length) reply.insertAdjacentHTML("beforeend", renderCalls(turn.trace));
    $("chat").scrollTop = $("chat").scrollHeight;
    speak(turn.reply || "Okay.");
    refresh();
  } catch (err) {
    reply.classList.add("error");
    reply.querySelector(".text").textContent = `Sorry, something went wrong: ${err.message}`;
    setState("idle");
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

$("composer").addEventListener("submit", (e) => { e.preventDefault(); ask($("say").value); $("say").value = ""; });

// Voice input through the browser's speech recognition (Chrome, Edge, Safari).
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Recognition) {
  const rec = new Recognition();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.onresult = (e) => ask(e.results[0][0].transcript);
  rec.onend = () => { $("mic").classList.remove("listening"); if ($("device").dataset.state === "listening") setState("idle"); };
  rec.onerror = () => setState("idle");
  $("mic").onclick = () => { $("mic").classList.add("listening"); setState("listening"); rec.start(); };
} else {
  $("mic").disabled = true;
  $("mic").title = "Voice input isn't supported in this browser. Type instead.";
}

/* ---------- Widgets ---------- */

function renderCheckin(events) {
  const first = events.filter((e) => isParent(e.by)).sort((a, b) => a.at.localeCompare(b.at))[0];
  const late = !first && nowHHMM() >= cfg.checkinDeadline;
  $("w-checkin").classList.toggle("pending", !first);
  $("ci-time").textContent = first ? fmtTime(first.at) : "Not yet";
  $("ci-sub").textContent = first ? "First words today" : `Expected by ${fmtHHMM(cfg.checkinDeadline)}`;
  $("ci-tag").textContent = first ? "Done" : late ? "Late" : "Waiting";
}

function renderMeds(items) {
  const meds = items.filter((i) => i.reminder.kind === "medication");
  const taken = meds.filter((i) => i.done).length;
  const now = nowHHMM();
  const late = meds.filter((i) => !i.done && i.time <= now).length;
  const frac = meds.length ? taken / meds.length : 0;
  $("donut").setAttribute("stroke-dashoffset", String(DONUT_LEN * (1 - frac)));
  $("donut-label").textContent = meds.length ? `${taken}/${meds.length}` : "0";
  $("med-tag").textContent = !meds.length ? "None" : taken === meds.length ? "All taken" : late ? "Overdue" : "On track";
  $("doses").innerHTML = meds.map((i) => {
    const overdue = !i.done && i.time <= now;
    const icon = i.done ? "ph-fill ph-check-circle" : overdue ? "ph-fill ph-warning-circle" : "ph ph-circle";
    return `<li class="${overdue ? "late" : ""}"><i class="${icon}"></i><span>${esc(i.reminder.title)}</span><span class="t num">${esc(i.done ? fmtTime(i.doneAt) : fmtHHMM(i.time))}</span></li>`;
  }).join("") || `<li class="empty-note">Nothing scheduled</li>`;
  $("med-sub").textContent = late ? `${late} dose${late > 1 ? "s" : ""} not confirmed yet` : taken === meds.length && meds.length ? "All taken today" : `${meds.length - taken} still to take today`;
}

function renderMood(todayEvents, week) {
  const todayMood = todayEvents.filter((e) => e.kind === "mood" && e.mood).pop();
  $("mood-tag").textContent = todayMood ? MOOD_LABEL[todayMood.mood] : "Not logged";
  $("faces").innerHTML = FACES.map((f, i) => `<i class="ph${todayMood && todayMood.mood === i + 1 ? "-fill on" : ""} ${f}" title="${MOOD_LABEL[i + 1]}"></i>`).join("");
  const days = week.doses.map((d) => d.date);
  const avg = (ymd) => {
    const m = [...week.events, ...todayEvents].filter((e, i, all) => e.kind === "mood" && e.mood && dayKey(e.at) === ymd && all.findIndex((x) => x.id === e.id) === i).map((e) => e.mood);
    return m.length ? m.reduce((a, b) => a + b, 0) / m.length : null;
  };
  const today = dayKey(new Date());
  $("mood-bars").innerHTML = days.map((d) => {
    const v = avg(d);
    return v ? `<span class="${d === today ? "today" : ""}" style="height:${Math.round((v / 5) * 100)}%" title="${esc(ymdLabel(d, { weekday: "long" }))}: ${MOOD_LABEL[Math.round(v)]}"></span>` : `<span class="none"></span>`;
  }).join("");
  $("mood-days").innerHTML = days.map((d) => `<span>${esc(ymdLabel(d, { weekday: "narrow" }))}</span>`).join("");
}

function renderMeals(events) {
  const n = events.filter((e) => e.kind === "meal").length;
  $("meal-count").textContent = String(n);
  $("meal-tag").textContent = n >= 3 ? "Well fed" : n ? "Today" : "None yet";
  $("bowls").innerHTML = [0, 1, 2].map((i) => `<div class="${i < n ? "on" : ""}"><i class="ph${i < n ? "-fill" : ""} ph-bowl-food"></i></div>`).join("");
}

function renderWeek(week, todayItems, todayEvents) {
  const today = dayKey(new Date());
  const meds = todayItems.filter((i) => i.reminder.kind === "medication");
  const now = nowHHMM();
  let taken = 0, scheduled = 0;
  $("week").innerHTML = week.doses.map((d) => {
    const isToday = d.date === today;
    let dots;
    if (isToday) {
      dots = meds.map((i) => `<span class="dot ${i.done ? "taken" : i.time <= now ? "missed" : "pending"}">${i.done ? '<i class="ph ph-check"></i>' : ""}</span>`);
      taken += meds.filter((i) => i.done).length;
      scheduled += meds.filter((i) => i.done || i.time <= now).length;
    } else {
      dots = Array.from({ length: d.scheduled }, (_, k) => `<span class="dot ${k < d.taken ? "taken" : "missed"}">${k < d.taken ? '<i class="ph ph-check"></i>' : ""}</span>`);
      taken += d.taken;
      scheduled += d.scheduled;
    }
    const checkedIn = isToday ? todayEvents.some((e) => isParent(e.by)) : !week.missedCheckinDays.includes(d.date);
    return `<div class="day-col ${isToday ? "today" : ""}" title="${esc(ymdLabel(d.date, { weekday: "long", month: "short", day: "numeric" }))}">
      <span class="dn">${isToday ? "Today" : esc(ymdLabel(d.date, { weekday: "short" }))}</span>
      <i class="ph-fill ph-sun ci ${checkedIn ? "" : "no"}"></i>
      <div class="doses">${dots.join("")}</div></div>`;
  }).join("");
  $("week-tag").textContent = scheduled ? `${Math.round((taken / scheduled) * 100)}% of doses taken` : "";
}

function renderAppt(upcoming) {
  const next = upcoming[0];
  if (!next) { $("appt").innerHTML = `<div class="empty-note" style="margin-top:auto">Nothing in the next two weeks</div>`; return; }
  const ymd = dayKey(next.dueAt);
  const days = Math.round((new Date(`${ymd}T12:00:00Z`) - new Date(`${dayKey(new Date())}T12:00:00Z`)) / 86_400_000);
  const when = days === 0 ? "Today" : days === 1 ? "Tomorrow" : `In ${days} days`;
  $("appt").innerHTML = `
    <div style="font-weight:600;font-size:15px">${esc(next.title)}</div>
    <div class="countdown">
      <div class="cal"><div class="m">${esc(ymdLabel(ymd, { month: "short" }))}</div><div class="d num">${esc(ymdLabel(ymd, { day: "numeric" }))}</div></div>
      <div style="min-width:0"><div class="big" style="font-size:22px;white-space:nowrap">${when}</div><div class="small">${esc(ymdLabel(ymd, { weekday: "long" }))}, ${esc(fmtTime(next.dueAt))}</div></div>
    </div>${upcoming.length > 1 ? `<div class="small">+${upcoming.length - 1} more coming up</div>` : ""}`;
}

function renderAlerts(alerts) {
  const list = alerts.slice().reverse();
  $("alert-tag").textContent = String(list.length);
  $("alerts").innerHTML = list.length
    ? `<ul class="alert-list">${list.slice(0, 3).map((a) => `<li><i class="ph-fill ph-warning-circle"></i><div>${esc(a.message)}<span class="when">${esc(ymdLabel(dayKey(a.sentAt), { weekday: "short" }))} ${esc(fmtTime(a.sentAt))}</span></div></li>`).join("")}</ul>`
    : `<div class="allgood"><i class="ph-fill ph-shield-check"></i>All quiet. Nothing missed.</div>`;
}

function renderFeedFilter() {
  const opts = [["all", "All"], ...Object.entries(KIND).map(([k, v]) => [k, v.label])];
  $("feed-filter").innerHTML = opts.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === feedFilter}">${l}</button>`).join("");
  $("feed-filter").querySelectorAll("button").forEach((b) => b.onclick = () => { feedFilter = b.dataset.k; renderFeedFilter(); renderFeed(lastTimeline, false); });
}

function renderFeed(events, markSeen = true) {
  lastTimeline = events;
  const today = dayKey(new Date());
  const yesterday = dayKey(Date.now() - 86_400_000);
  const list = events.filter((e) => feedFilter === "all" || e.kind === feedFilter).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 12);
  const fresh = (id) => markSeen && seenEvents && !seenEvents.has(id);
  $("feed").innerHTML = list.length ? list.map((e) => {
    const k = dayKey(e.at);
    const day = k === today ? "" : k === yesterday ? "Yesterday " : `${ymdLabel(k, { weekday: "short" })} `;
    return `<li class="${fresh(e.id) ? "fresh" : ""}"><span class="fi ${esc(e.kind)}"><i class="ph ${KIND[e.kind]?.icon || "ph-dot"}"></i></span>
      <div class="ft"><span class="tx">${esc(e.text)}</span><span class="meta">${esc(e.by)}, ${esc(day)}${esc(fmtTime(e.at))}</span></div></li>`;
  }).join("") : `<li><span class="empty-note">Nothing here yet. Say "Good morning" to Alexa.</span></li>`;
  if (markSeen) seenEvents = new Set(events.map((e) => e.id));
}

function renderBackstage(activity) {
  const env = cfg.environment;
  $("env-tag").textContent = env ? "Emulated AWS" : "Local";
  const SVC_ICON = { DynamoDB: "ph-database", Lambda: "ph-function", EventBridge: "ph-alarm", SNS: "ph-paper-plane-tilt", Bedrock: "ph-sparkle" };
  const entries = env
    ? Object.entries(env)
    : [["Data", BACKEND_LABEL.store[cfg.store] || cfg.store], ["Summaries", BACKEND_LABEL.summarizer[cfg.summarizer] || cfg.summarizer], ["Alerts", BACKEND_LABEL.notifier[cfg.notifier] || cfg.notifier], ["AWS", "Run npm run aws:local to emulate it"]];
  $("env").innerHTML = entries.map(([k, v]) => `<div class="svc"><b><i class="ph ${SVC_ICON[k] || "ph-circle-dashed"}"></i>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  $("activity").innerHTML = activity.length
    ? activity.slice(0, 20).map((a) => `<li><span class="lt">${esc(fmtTime(a.at))}</span><span class="ls ${esc(a.source)}">${esc(a.source)}</span><span class="lm">${esc(a.message)}</span></li>`).join("")
    : `<li><span class="empty-note">${env ? "Waiting for the first request. Talk to Alexa to see Lambda calls here." : "Server events (alerts, Lambda calls, scheduled runs) appear here."}</span></li>`;
}

function setLive(ok) {
  const el = document.querySelector(".backend.live");
  if (!el) return;
  el.classList.toggle("down", !ok);
  el.querySelector("b").textContent = ok ? "Live" : "Offline";
}

async function refresh() {
  try {
    const [status, today, upcoming, timeline, week, activity] = await Promise.all([api("status"), api("today"), api("upcoming"), api("timeline?days=3"), api("week"), api("activity")]);
    $("summary").textContent = status.summary;
    renderCheckin(today.events);
    renderMeds(today.items);
    renderMood(today.events, week);
    renderMeals(today.events);
    renderWeek(week, today.items, today.events);
    renderAppt(upcoming);
    renderAlerts(timeline.alerts);
    renderFeed(timeline.events);
    renderBackstage(activity);
    setLive(true);
  } catch {
    setLive(false);
  }
}

$("check").onclick = async () => {
  const btn = $("check");
  btn.disabled = true;
  try {
    const out = await api("check", { method: "POST" });
    $("report").hidden = false;
    $("report").innerHTML = out.misses.length
      ? out.misses.map((m) => `<div><i class="ph-fill ph-warning-circle" style="color:var(--med)"></i> ${esc(m.message)} <span style="color:var(--muted)">(${out.sent.some((s) => s.key === m.key) ? "alert sent" : "already alerted"})</span></div>`).join("")
      : `<div><i class="ph-fill ph-check-circle" style="color:var(--leaf)"></i> Nothing missed so far today.</div>`;
    refresh();
  } catch (err) {
    $("report").hidden = false;
    $("report").textContent = `Check failed: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
};

$("weekly").onclick = async () => {
  const btn = $("weekly");
  btn.disabled = true;
  $("doc-body").innerHTML = '<span class="sk" style="display:block;width:90%;margin:8px 0"></span><span class="sk" style="display:block;width:70%;margin:8px 0"></span><span class="sk" style="display:block;width:80%;margin:8px 0"></span>';
  $("doc-dialog").showModal();
  try {
    $("doc-body").textContent = (await api("weekly")).summary;
  } catch (err) {
    $("doc-body").textContent = `Couldn't write the summary: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
};
$("doc-close").onclick = () => $("doc-dialog").close();
$("doc-print").onclick = () => window.print();

function renderBackends() {
  const items = [["store", "ph-database", "Data"], ["summarizer", "ph-sparkle", "Summaries"], ["notifier", "ph-paper-plane-tilt", "Alerts"], ["brain", "ph-waveform", "Alexa"]].filter(([k]) => cfg[k]);
  $("backends").innerHTML = items.map(([k, icon, label]) =>
    `<span class="backend"><i class="ph ${icon}"></i>${label} <b>${esc(BACKEND_LABEL[k][cfg[k]] || cfg[k])}</b></span>`).join("") +
    `<span class="backend live"><i class="ph ph-broadcast"></i><b>Live</b></span>`;
}

(async () => {
  try { cfg = { ...cfg, ...(await api("config")) }; } catch {}
  document.title = `CareCircle: ${cfg.parentName}`;
  $("tagline").textContent = `for ${cfg.parentName}`;
  $("say-q").textContent = `"How's ${cfg.parentName} today?"`;
  renderBackends();
  renderFeedFilter();
  setupSpeakers();
  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
